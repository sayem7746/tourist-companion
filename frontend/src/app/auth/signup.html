<section>
  <h1>Create account</h1>
  <p>Sign up to save trips and referrals.</p>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <form (ngSubmit)="submit()">
    <label>
      Display name
      <input name="displayName" type="text" [(ngModel)]="displayName" required maxlength="80" />
    </label>
    <label>
      Email
      <input name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
    </label>
    <label>
      Password
      <input
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="new-password"
      />
    </label>
    <button type="submit" [disabled]="pending()">Sign up</button>
  </form>
  <p class="meta">Already have an account? <a routerLink="/login">Sign in</a></p>
</section>
