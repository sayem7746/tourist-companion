<section>
  <h1>Admin sign in</h1>
  <p>Operational users only. Traveler accounts cannot access this area.</p>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <form (ngSubmit)="submit()">
    <label>
      Email
      <input name="email" type="email" [(ngModel)]="email" required autocomplete="username" />
    </label>
    <label>
      Password
      <input
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="current-password"
      />
    </label>
    <button type="submit" [disabled]="pending()">Sign in</button>
  </form>
</section>
