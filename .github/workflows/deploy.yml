# Placeholder deploy workflow. Secrets are never written to the repo.
# Create GitHub Environments `staging` and `production` and add the secret names below.
# See infra/SECRETS.md.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.event.inputs.target || github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP_ENV: staging
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Build frontend (staging)
        working-directory: frontend
        env:
          NG_APP_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: npm ci && npm run build:staging
      - name: Build backend
        working-directory: backend
        run: npm ci && npm run build
      - name: Migrate (staging DATABASE_URL)
        working-directory: backend
        run: npm run db:migrate
      - name: Deploy placeholder
        run: |
          echo "Injected secrets via GitHub Environment 'staging' (values never echoed)."
          echo "Wire this step to the chosen host when infrastructure exists."
          test -n "$DATABASE_URL"
          test -n "$JWT_SECRET"
          test -n "$FRONTEND_ORIGIN"
          test -n "$API_BASE_URL"

  deploy-production:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: production
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Build frontend (production)
        working-directory: frontend
        env:
          NG_APP_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: npm ci && npm run build:production
      - name: Build backend
        working-directory: backend
        run: npm ci && npm run build
      - name: Migrate (production DATABASE_URL)
        working-directory: backend
        run: npm run db:migrate
      - name: Deploy placeholder
        run: |
          echo "Injected secrets via GitHub Environment 'production' (values never echoed)."
          echo "Require a reviewer on this environment. Do not run db:seed."
          test -n "$DATABASE_URL"
          test -n "$JWT_SECRET"
          test -n "$FRONTEND_ORIGIN"
          test -n "$API_BASE_URL"
